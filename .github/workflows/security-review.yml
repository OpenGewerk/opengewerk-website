name: Security-Review

# The security review of the organisation (OpenGewerk/.github,
# .github/workflows/security-review.yml) for every pull request: with a shell
# in a sandbox on pull_request for a branch of this repository by a member or
# by the coding agent of CodeRabbit (never approved), by reading alone on
# pull_request_target for anything else, Dependabot included. A new push cancels
# the run of the push before, so only the newest head is reviewed. The call
# pins a commit of that workflow on its main: a change there reaches this
# repository with a pull request here, which moves the commit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  security-review:
    name: Security-Review
    uses: OpenGewerk/.github/.github/workflows/security-review.yml@b7b6ba3db1a2806e4d04cde501c451a86b6585e5 # main
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      statuses: write
